<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="scoreboard">
            <div class="team">
                <h3>HOME</h3>
                <div id="home-el" class="score">0</div>
                <div class="btns">
                    <button onclick="changeScore('home' , 1)">+1</button>
                    <button onclick="changeScore('home' , 2)">+2</button>
                    <button onclick="changeScore('home' , -1)">-1</button>
                </div>
                </div>
                <div class="center panel">
                    <div id="period-el" class="period">Period: 1</div>
                    <button class="period-btn" onclick="nextPeriod()">Next Period</button>
                    <div id="timer-el" class="timer">12:00</div>
                    <div class="timer-btns">
                    <button onclick="startTimer()">START</button>
                    <button onclick="stopTimer()">STOP</button>
                    </div>
                </div>
                <div class="team">
                    <h3>AWAY</h3>
                    <div id="guest-el" class="score">0</div>
                    <div class="btns">
                        <button onclick="changeScore('guest' , 1)">+1</button>
                        <button onclick="changeScore('guest' , 2)">+2</button>
                        <button onclick="changeScore('guest' , 1)">-1</button>
                    </div>
                </div>
                </div>
                <script src="index.js"></script>
    </body>
</html>
